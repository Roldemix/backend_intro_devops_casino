name: CI/CD casino - Backend 
on:
  push:
    branches: [ "deploy" ]

jobs:
  build-push-deploy-backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login en Amazon ECR (runner)
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build imagen Backend y push a ECR
      run: |
        docker build -t casino-backend .
        docker tag casino-backend:latest ${{ secrets.ECR_REPO_URL_BACKEND }}:latest
        docker push ${{ secrets.ECR_REPO_URL_BACKEND }}:latest

    # ========================================================================
    # DESPLIEGUE UNIFICADO (JSON REFORMATEADO EN UNA LÍNEA PARA EVITAR ERRORES)
    # ========================================================================
    - name: Desplegar Entorno Completo vía SSM
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_BACKEND_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --comment "Despliegue unificado de Back y BD con Docker Compose en AL2023" \
          --region ${{ secrets.AWS_REGION }} \
          --parameters '{"commands":[
            "set -e",
            "mkdir -p /home/ec2-user/casino",
            "cd /home/ec2-user/casino",
            "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
            "printf \"version: '3.8'\nservices:\n  casino-db:\n    image: postgres:16-alpine\n    container_name: casino-db\n    restart: always\n    environment:\n      POSTGRES_USER: root\n      POSTGRES_DB: ${{ secrets.DB_NAME }}\n      POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n    ports:\n      - '5432:5432'\n    networks:\n      - casino-network\n\n  casino-backend:\n    image: ${{ secrets.ECR_REPO_URL_BACKEND }}:latest\n    container_name: casino-backend\n    restart: always\n    ports:\n      - '3000:3000'\n    environment:\n      - PORT=3000\n      - CORS_ORIGIN=*\n      - DB_USER=root\n      - DB_PASSWORD=${{ secrets.DB_PASSWORD }}\n      - DB_NAME=${{ secrets.DB_NAME }}\n      - DB_PORT=5432\n      - DB_HOST=casino-db\n    depends_on:\n      - casino-db\n    networks:\n      - casino-network\n\nvolumes:\n  postgres_data:\n\nnetworks:\n  casino-network:\n    driver: bridge\n\" > docker-compose.yml",
            "docker compose pull casino-backend",
            "docker compose up -d"
          ]}'