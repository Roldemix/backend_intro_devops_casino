name: CI/CD casino - Backend 
on:
  push:
    branches: [ "deploy" ]

jobs:
  build-push-deploy-backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login en Amazon ECR (runner)
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build imagen Backend y push a ECR
      run: |
        docker build -t casino-backend .
        docker tag casino-backend:latest ${{ secrets.ECR_REPO_URL_BACKEND }}:latest
        docker push ${{ secrets.ECR_REPO_URL_BACKEND }}:latest

    # ========================================================================
    # DESPLIEGUE UNIFICADO (CORRECCIÓN ABSOLUTA DE SINTAXIS)
    # ========================================================================
    - name: Desplegar Entorno Completo vía SSM
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_BACKEND_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --comment "Despliegue unificado con inicializacion limpia de BD" \
          --region ${{ secrets.AWS_REGION }} \
          --parameters '{"commands":[
            "set -e",
            "mkdir -p /home/ec2-user/casino",
            "cd /home/ec2-user/casino",
            "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
            "echo \"version: \\\"3.8\\\"\" > docker-compose.yml",
            "echo \"services:\" >> docker-compose.yml",
            "echo \"  casino-db:\" >> docker-compose.yml",
            "echo \"    image: postgres:16-alpine\" >> docker-compose.yml",
            "echo \"    container_name: casino-db\" >> docker-compose.yml",
            "echo \"    restart: always\" >> docker-compose.yml",
            "echo \"    environment:\" >> docker-compose.yml",
            "echo \"      POSTGRES_USER: root\" >> docker-compose.yml",
            "echo \"      POSTGRES_DB: ${{ secrets.DB_NAME }}\" >> docker-compose.yml",
            "echo \"      POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}\" >> docker-compose.yml",
            "echo \"    volumes:\" >> docker-compose.yml",
            "echo \"      - postgres_data:/var/lib/postgresql/data\" >> docker-compose.yml",
            "echo \"      - ./init.sql:/docker-entrypoint-initdb.d/init.sql\" >> docker-compose.yml",
            "echo \"    ports:\" >> docker-compose.yml",
            "echo \"      - \\\"5432:5432\\\"\" >> docker-compose.yml",
            "echo \"    networks:\" >> docker-compose.yml",
            "echo \"      - casino-network\" >> docker-compose.yml",
            "echo \"\" >> docker-compose.yml",
            "echo \"  casino-backend:\" >> docker-compose.yml",
            "echo \"    image: ${{ secrets.ECR_REPO_URL_BACKEND }}:latest\" >> docker-compose.yml",
            "echo \"    container_name: casino-backend\" >> docker-compose.yml",
            "echo \"    restart: always\" >> docker-compose.yml",
            "echo \"    ports:\" >> docker-compose.yml",
            "echo \"      - \\\"3000:3000\\\"\" >> docker-compose.yml",
            "echo \"    environment:\" >> docker-compose.yml",
            "echo \"      - PORT=3000\" >> docker-compose.yml",
            "echo \"      - CORS_ORIGIN=*\" >> docker-compose.yml",
            "echo \"      - DB_USER=root\" >> docker-compose.yml",
            "echo \"      - DB_PASSWORD=${{ secrets.DB_PASSWORD }}\" >> docker-compose.yml",
            "echo \"      - DB_NAME=${{ secrets.DB_NAME }}\" >> docker-compose.yml",
            "echo \"      - DB_PORT=5432\" >> docker-compose.yml",
            "echo \"      - DB_HOST=casino-db\" >> docker-compose.yml",
            "echo \"    depends_on:\" >> docker-compose.yml",
            "echo \"      - casino-db\" >> docker-compose.yml",
            "echo \"    networks:\" >> docker-compose.yml",
            "echo \"      - casino-network\" >> docker-compose.yml",
            "echo \"\" >> docker-compose.yml",
            "echo \"volumes:\" >> docker-compose.yml",
            "echo \"  postgres_data:\" >> docker-compose.yml",
            "echo \"\" >> docker-compose.yml",
            "echo \"networks:\" >> docker-compose.yml",
            "echo \"  casino-network:\" >> docker-compose.yml",
            "echo \"    driver: bridge\" >> docker-compose.yml",
            "docker compose pull casino-backend",
            "docker create --name temp-back ${{ secrets.ECR_REPO_URL_BACKEND }}:latest",
            "docker cp temp-back:/app/init.sql ./init.sql || docker cp temp-back:/app/src/db/init.sql ./init.sql || true",
            "docker rm temp-back",
            "docker compose up -d"
          ]}'