name: Build and Deploy to EKS

on:
  push:
    branches: [ main, master ]

env:
  AWS_REGION: us-east-1
  ECR_NAMESPACE: casino

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag and push image
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_NAME: backend
        run: |
          set -euo pipefail
          image="${ECR_REGISTRY}/${ECR_NAMESPACE}/${IMAGE_NAME}"
          docker build -t "${image}:latest" -t "${image}:${IMAGE_TAG}" .
          docker push "${image}:${IMAGE_TAG}"
          docker push "${image}:latest"

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Update deployment image
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_NAME: backend
        run: |
          set -euo pipefail
          image="${ECR_REGISTRY}/${ECR_NAMESPACE}/${IMAGE_NAME}:${IMAGE_TAG}"
          kubectl -n casino set image deployment/backend backend=${image} || echo "set image failed"
